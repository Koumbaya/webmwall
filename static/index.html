<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WEBM Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: #eee;
      --columns: 3;
      overflow: hidden;
    }
    #controls {
      padding: 15px;
      position: fixed;
      top: -80px;
      left: 0;
      right: 0;
      background: rgba(34, 34, 34, 0.95);
      backdrop-filter: blur(10px);
      z-index: 10;
      border-bottom: 1px solid #333;
      color: #eee;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      transition: top 0.3s ease;
    }
    #controls.show {
      top: 0;
    }
    #controls-trigger {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 40px;
      height: 40px;
      background: rgba(34, 34, 34, 0.4);
      border: 1px solid #555;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 11;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      opacity: 0.6;
    }
    #controls-trigger:hover {
      background: rgba(68, 68, 68, 0.6);
      transform: rotate(90deg);
    }
    #controls-trigger.hide, #exit-trigger.hide {
      opacity: 0;
      pointer-events: none;
    }
    .gear-icon {
      width: 20px;
      height: 20px;
      background: url('gear.png') center/contain no-repeat;
      filter: invert(1) brightness(0.9) opacity(0.7);
    }
    #exit-trigger {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      background: rgba(34, 34, 34, 0.4);
      border: 1px solid #555;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 11;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      opacity: 0.6;
    }
    #exit-trigger:hover {
      background: rgba(220, 53, 69, 0.6);
      border-color: #c82333;
      opacity: 1;
    }
    .exit-icon {
      width: 20px;
      height: 20px;
      background: url('exit.svg') center/contain no-repeat;
      filter: invert(1) brightness(0.9) opacity(0.7);
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .container {
      display: flex;
      gap: 10px;
      padding: 10px;
      margin-top: 0;
      height: 100vh;
      overflow: hidden;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      position: relative;
    }
    .column-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform linear;
      will-change: transform;
    }
    .grid-item {
      width: 100%;
      background: #222;
      flex-shrink: 0;
      border-radius: 4px;
      position: relative;
    }
    .grid-item video, .grid-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      background: #111;
      border-radius: 4px;
    }
    input[type="range"] {
      min-width: 80px;
    }
    button {
      background: #333;
      border: 1px solid #555;
      color: #eee;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover {
      background: #444;
    }
    button:active {
      background: #555;
    }
    #pauseButton {
      font-size: 16px;
      padding: 6px 10px;
    }
    #muteButton, #pauseButton, #columnUp, #columnDown {
      background: #333;
      border: 1px solid #555;
      color: #eee;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #muteButton img, #pauseButton img, #columnUp img, #columnDown img, #exitButton img, #directionButton img {
      width: 16px;
      height: 16px;
      filter: invert(1) brightness(0.9);
    }
    #exitButton {
      background: #333;
      border: 1px solid #555;
      color: #eee;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #exitButton:hover {
      background: #dc3545;
      border-color: #c82333;
    }
    .speed-btn {
      background: #333;
      border: 1px solid #555;
      color: #eee;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
      min-width: 40px;
    }
    .speed-btn:hover {
      background: #444;
    }
    .speed-btn.active {
      background: #555;
      border-color: #888;
      color: #fff;
    }
    .filter-button {
      background: #333;
      border: 2px solid transparent;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .filter-button:hover {
      background: #444;
    }
    .filter-button.active {
      border-color: #666;
      background: #3a3a3a;
    }
    .filter-button.inactive {
      opacity: 0.4;
    }
    .filter-button img {
      width: 20px;
      height: 20px;
      filter: invert(1) brightness(0.9);
    }

    /* Delete functionality styles */
    .grid-item {
      position: relative;
    }

    .delete-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: rgba(220, 53, 69, 0.4);
      border: 1px solid rgba(220, 53, 69, 0.8);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .grid-item:hover .delete-overlay {
      opacity: 1;
    }

    .delete-overlay::before {
      content: '×';
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
    }

    .delete-overlay:hover {
      background: rgba(220, 53, 69, 0.6);
      transform: scale(1.1);
    }

    .pin-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      background: rgba(100, 149, 237, 0.4);
      border: 1px solid rgba(100, 149, 237, 0.8);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .grid-item:hover .pin-overlay {
      opacity: 1;
    }

    .pin-overlay:hover {
      background: rgba(100, 149, 237, 0.6);
      transform: scale(1.1);
    }

    .pin-overlay.pinned {
      opacity: 1;
      background: rgba(100, 149, 237, 0.7);
    }

    .pin-overlay::before {
      content: '⊕';
      color: #fff;
      font-size: 14px;
      line-height: 1;
    }

    .pin-overlay.pinned::before {
      content: '⊗';
    }

    .delete-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .delete-modal.show {
      display: flex;
    }

    .delete-modal-content {
      background: rgba(34, 34, 34, 0.95);
      border: 1px solid #555;
      border-radius: 8px;
      padding: 20px;
      max-width: 300px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .delete-modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    .delete-confirm-btn {
      background: #dc3545;
      border: 1px solid #c82333;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .delete-confirm-btn:hover {
      background: #c82333;
    }

    .delete-cancel-btn {
      background: #6c757d;
      border: 1px solid #5a6268;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .delete-cancel-btn:hover {
      background: #5a6268;
    }

    #focusModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    #focusModal.show {
      display: flex;
    }

    #focusContent {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
      cursor: default;
    }

    #focusContent img,
    #focusContent video {
      display: block;
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="control-group">
      <button id="columnDown"><img src="colminus.png" alt="Remove Column"></button>
      <button id="columnUp"><img src="colplus.png" alt="Add Column"></button>
    </div>

    <div class="control-group">
      <button id="speed2x" class="speed-btn">2x</button>
      <button id="speed4x" class="speed-btn">4x</button>
      <button id="speed6x" class="speed-btn">6x</button>
      <button id="pauseButton"><img src="pause.png" alt="Pause"></button>
      <button id="directionButton" title="Scroll direction"><img src="alternate.png" alt="Alternate"></button>
    </div>

    <div class="control-group">
      <button id="muteButton"><img src="mute.png" alt="Mute"></button>
    </div>

    <div class="control-group">
      <div class="filter-button active" id="filterGif">
        <img src="gif.png" alt="GIF">
      </div>
      <div class="filter-button active" id="filterWebm">
        <img src="webm.png" alt="WEBM">
      </div>
      <div class="filter-button active" id="filterMp4">
        <img src="mp4.png" alt="MP4">
      </div>
      <div class="filter-button active" id="filterImages">
        <img src="jpg.png" alt="Images">
      </div>
    </div>

    <div class="control-group" style="margin-left: auto; align-items: center; gap: 12px;">
      <span id="fileCount" style="font-size: 12px; color: #888; white-space: nowrap;"></span>
      <button id="exitButton" title="Exit application"><img src="exit.svg" alt="Exit"></button>
    </div>
  </div>

  <div id="controls-trigger">
    <div class="gear-icon"></div>
  </div>

  <div id="exit-trigger">
    <div class="exit-icon"></div>
  </div>

  <div class="container" id="videoContainer"></div>

  <div id="focusModal">
    <div id="focusContent"></div>
  </div>

  <div class="delete-modal" id="deleteModal">
    <div class="delete-modal-content">
      <h3>Confirm Deletion</h3>
      <p>Are you sure you want to delete this item?</p>
      <div class="delete-modal-buttons">
        <button class="delete-confirm-btn" id="confirmDeleteButton">Yes, Delete</button>
        <button class="delete-cancel-btn" id="cancelDeleteButton">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    const container = document.getElementById('videoContainer');
    const filterGif = document.getElementById('filterGif');
    const filterWebm = document.getElementById('filterWebm');
    const filterMp4 = document.getElementById('filterMp4');
    const filterImages = document.getElementById('filterImages');
    const speed2xButton = document.getElementById('speed2x');
    const speed4xButton = document.getElementById('speed4x');
    const speed6xButton = document.getElementById('speed6x');
    const pauseButton = document.getElementById('pauseButton');
    const directionButton = document.getElementById('directionButton');
    const columnUpButton = document.getElementById('columnUp');
    const columnDownButton = document.getElementById('columnDown');
    const muteButton = document.getElementById('muteButton');
    const deleteModal = document.getElementById('deleteModal');
    const confirmDeleteButton = document.getElementById('confirmDeleteButton');
    const cancelDeleteButton = document.getElementById('cancelDeleteButton');

    let mediaStats = null;
    const fileCountEl = document.getElementById('fileCount');

    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        mediaStats = await res.json();
        updateFileCount();
      } catch (e) {
        console.error('Failed to fetch stats', e);
      }
    }

    function updateFileCount() {
      if (!mediaStats) return;
      let count = 0;
      if (filterGif.classList.contains('active'))    count += mediaStats.gif;
      if (filterWebm.classList.contains('active'))   count += mediaStats.webm;
      if (filterMp4.classList.contains('active'))    count += mediaStats.mp4;
      if (filterImages.classList.contains('active')) count += mediaStats.images;
      fileCountEl.textContent = `${count} files`;
    }

    function adjustStats(url, delta) {
      if (!mediaStats) return;
      const ext = url.split('.').pop().toLowerCase();
      if (ext === 'gif')                                          mediaStats.gif    += delta;
      else if (ext === 'webm')                                    mediaStats.webm   += delta;
      else if (ext === 'mp4')                                     mediaStats.mp4    += delta;
      else if (['jpg','jpeg','png','bmp','webp'].includes(ext))   mediaStats.images += delta;
      mediaStats.total += delta;
      updateFileCount();
    }

    let columns = 3;
    const baseSpeed = 16;
    let scrollSpeed = baseSpeed;
    let currentMultiplier = null;
    let columnElements = [];
    let columnContents = [];
    let columnLoading = [];
    let columnJitter = [];
    let animationFrameId = null;
    let isScrolling = false;
    let scrollDirection = 'alternate'; // 'alternate' | 'down' | 'up'
    let isMuted = true;
    let unmutedVideo = null; // Track the single unmuted video element
    const pinnedItems = new Map(); // item element → { spacer, columnIndex }

    function setSpeed(multiplier) {
      const speedMap = { '2x': 2, '4x': 4, '6x': 6 };

      // Toggle off if clicking the same button
      if (currentMultiplier === multiplier) {
        scrollSpeed = baseSpeed;
        currentMultiplier = null;
        [speed2xButton, speed4xButton, speed6xButton].forEach(btn => btn.classList.remove('active'));
        return;
      }

      scrollSpeed = baseSpeed * speedMap[multiplier];
      currentMultiplier = multiplier;

      // Update button states
      [speed2xButton, speed4xButton, speed6xButton].forEach(btn => btn.classList.remove('active'));
      document.getElementById(`speed${multiplier}`).classList.add('active');
    }

    speed2xButton.addEventListener('click', () => setSpeed('2x'));
    speed4xButton.addEventListener('click', () => setSpeed('4x'));
    speed6xButton.addEventListener('click', () => setSpeed('6x'));

    const directionCycle = ['alternate', 'down', 'up'];
    const directionIcons = { alternate: 'alternate.png', down: 'down.png', up: 'up.png' };

    directionButton.addEventListener('click', () => {
      const next = directionCycle[(directionCycle.indexOf(scrollDirection) + 1) % directionCycle.length];
      scrollDirection = next;
      directionButton.innerHTML = `<img src="${directionIcons[next]}" alt="${next}">`;
      resetGrid();
    });

    pauseButton.addEventListener('click', () => {
      if (isScrolling) {
        stopScrolling();
        pauseButton.innerHTML = '<img src="play.png" alt="Play">';
      } else {
        startScrolling();
        pauseButton.innerHTML = '<img src="pause.png" alt="Pause">';
      }
    });

    columnUpButton.addEventListener('click', () => {
      columns = Math.min(columns + 1, 6);
      resetGrid();
    });

    columnDownButton.addEventListener('click', () => {
      columns = Math.max(columns - 1, 1);
      resetGrid();
    });

    function unmuteRandomVideo() {
      // Mute the previously unmuted video if any
      if (unmutedVideo) {
        unmutedVideo.muted = true;
        unmutedVideo = null;
      }

      const videos = Array.from(document.querySelectorAll('video'));
      if (videos.length === 0) return;

      const pick = videos[Math.floor(Math.random() * videos.length)];
      pick.muted = false;
      unmutedVideo = pick;
    }

    muteButton.addEventListener('click', () => {
      isMuted = !isMuted;
      muteButton.innerHTML = isMuted ? '<img src="mute.png" alt="Mute">' : '<img src="unmute.png" alt="Unmute">';

      if (isMuted) {
        // Mute everything
        if (unmutedVideo) {
          unmutedVideo.muted = true;
          unmutedVideo = null;
        }
      } else {
        // Unmute a single random video
        unmuteRandomVideo();
      }
    });

    function getFilters() {
      const filters = [];
      if (filterGif.classList.contains('active')) filters.push('gif');
      if (filterWebm.classList.contains('active')) filters.push('webm');
      if (filterMp4.classList.contains('active')) filters.push('mp4');
      if (filterImages.classList.contains('active')) filters.push('jpg', 'png', 'bmp', 'jpeg', 'webp');
      return filters;
    }

    function resetGrid() {
      stopScrolling();
      pinnedItems.forEach((_, item) => releaseItem(item));
      pinnedItems.clear();
      columnContents.forEach(content => {
        Array.from(content.children).forEach(releaseItem);
      });
      container.innerHTML = '';
      columnElements = [];
      columnContents = [];
      columnLoading = [];
      columnJitter = [];
      unmutedVideo = null;

      for (let i = 0; i < columns; i++) {
        const column = document.createElement('div');
        column.className = 'column';

        const columnContent = document.createElement('div');
        columnContent.className = 'column-content';

        column.appendChild(columnContent);
        container.appendChild(column);

        columnElements[i] = column;
        columnContents[i] = columnContent;
        columnLoading[i] = false;
        columnJitter[i] = 1 + (Math.random() * 0.06 - 0.03);

        // Preload items for each column
        loadInitialItems(i);
      }

      startScrolling();

      // Re-pick an unmuted video after grid rebuild
      if (!isMuted) {
        setTimeout(() => unmuteRandomVideo(), 500);
      }
    }

    function isScrollUp(columnIndex) {
      if (scrollDirection === 'up') return true;
      if (scrollDirection === 'down') return false;
      return columnIndex % 2 === 0;
    }

    async function loadInitialItems(columnIndex) {
      const itemsToLoad = Math.ceil(window.innerHeight / 200) + 10; // Load enough items to fill screen plus buffer
      const scrollUp = isScrollUp(columnIndex);

      for (let j = 0; j < itemsToLoad; j++) {
        await addNewItemToColumn(columnIndex, !scrollUp, true);
      }

      if (!scrollUp) {
        // For columns scrolling down, we need to set an initial negative transform
        // so the "top" of the content is off-screen up, and it can scroll down.
        const content = columnContents[columnIndex];
        const totalHeight = Array.from(content.children).reduce((acc, child) => acc + child.offsetHeight + 10, 0);
        const initialY = -(totalHeight - columnElements[columnIndex].offsetHeight);
        content.style.transform = `translateY(${initialY}px)`;
      }
    }

    async function fetchRandomFile() {
      const filters = getFilters();
      const filterParam = filters.length > 0 ? `&types=${filters.join(',')}` : '';
      const res = await fetch(`/api/videos?page=0&limit=1${filterParam}`);
      const urls = await res.json();
      return urls[0];
    }

    function createGridItem(url) {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.dataset.url = url; // Store the URL for deletion

      if (url.endsWith('.webm') || url.endsWith('.mp4')) {
        const video = document.createElement('video');
        video.src = url;
        video.loop = true;
        video.autoplay = true;
        video.muted = true; // Always muted; unmute is handled per-video
        item.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = url;
        item.appendChild(img);
      }

      // Add pin overlay
      const pinOverlay = document.createElement('div');
      pinOverlay.className = 'pin-overlay';
      item.appendChild(pinOverlay);

      pinOverlay.addEventListener('click', (e) => {
        e.stopPropagation();
        if (pinnedItems.has(item)) {
          unpinItem(item);
        } else {
          pinItem(item);
        }
      });

      // Add delete overlay
      const deleteOverlay = document.createElement('div');
      deleteOverlay.className = 'delete-overlay';
      item.appendChild(deleteOverlay);

      return item;
    }

    function releaseItem(item) {
      const video = item.querySelector('video');
      if (video) {
        video.pause();
        video.src = '';
        video.load();
      }
    }

    async function addNewItemToColumn(columnIndex, addToTop = false, isInitialLoad = false) {
      if (columnLoading[columnIndex]) return;
      columnLoading[columnIndex] = true;

      try {
        const url = await fetchRandomFile();
        const item = createGridItem(url);
        const content = columnContents[columnIndex];

        const mediaElement = item.querySelector('img, video');
        if (mediaElement) {
            try {
                if (mediaElement.tagName === 'IMG') {
                    await new Promise((resolve, reject) => {
                        mediaElement.onload = resolve;
                        mediaElement.onerror = reject;
                    });
                } else if (mediaElement.tagName === 'VIDEO') {
                    await new Promise((resolve, reject) => {
                        mediaElement.onloadedmetadata = resolve;
                        mediaElement.onerror = reject;
                    });
                }
            } catch (e) {
                console.error("Media failed to load", e);
            }
        }

        if (addToTop) {
          if (!isInitialLoad) {
            content.style.transition = 'none';
          }

          // Add item to a temporary container to measure its height
          const tempContainer = document.createElement('div');
          tempContainer.style.position = 'absolute';
          tempContainer.style.visibility = 'hidden';
          tempContainer.style.width = columnElements[columnIndex].offsetWidth + 'px';
          document.body.appendChild(tempContainer);
          tempContainer.appendChild(item);
          const itemHeight = item.offsetHeight + 10;
          tempContainer.removeChild(item);
          document.body.removeChild(tempContainer);


          // Get the latest scroll position right before making changes
          const transform = getComputedStyle(content).transform;
          let currentY = 0;
          if (transform !== 'none') {
            const matrix = transform.match(/matrix\(([^)]+)\)/);
            if (matrix) {
              currentY = parseFloat(matrix[1].split(',')[5]) || 0;
            }
          }

          // Adjust scroll position and then insert the item
          content.style.transform = `translateY(${currentY - itemHeight}px)`;
          content.insertBefore(item, content.firstChild);

          if (!isInitialLoad) {
            content.offsetHeight;
            content.style.transition = 'transform linear';
          }

        } else {
          content.appendChild(item);
        }
      } catch (error) {
        console.error('Failed to add item to column:', error);
      } finally {
        columnLoading[columnIndex] = false;
      }
    }

    function pinItem(item) {
      const content = item.parentElement;
      const column = content.parentElement;
      const columnIndex = columnContents.indexOf(content);

      const itemRect = item.getBoundingClientRect();
      const columnRect = column.getBoundingClientRect();
      const topOffset = itemRect.top - columnRect.top;

      // Create a spacer that holds the gap in the flow while item is pinned
      const spacer = document.createElement('div');
      spacer.style.height = item.offsetHeight + 'px';
      spacer.style.flexShrink = '0';
      content.replaceChild(spacer, item);

      // Float item absolutely over the column at its current visual position
      item.style.position = 'absolute';
      item.style.top = topOffset + 'px';
      item.style.left = '0';
      item.style.width = '100%';
      item.style.boxSizing = 'border-box';
      item.style.zIndex = '3';
      column.appendChild(item);

      const pinOverlay = item.querySelector('.pin-overlay');
      pinOverlay.classList.add('pinned');

      pinnedItems.set(item, { spacer, columnIndex });
    }

    function unpinItem(item) {
      const { spacer } = pinnedItems.get(item);
      pinnedItems.delete(item);

      if (spacer.parentNode) spacer.parentNode.removeChild(spacer);

      item.style.transition = 'opacity 0.3s ease';
      item.style.opacity = '0';
      setTimeout(() => {
        if (item.parentNode) {
          releaseItem(item);
          item.parentNode.removeChild(item);
        }
      }, 300);
    }

    function startScrolling() {
      if (isScrolling || scrollSpeed === 0) return;

      isScrolling = true;
      scrollAllColumns();
    }

    function stopScrolling() {
      isScrolling = false;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    function scrollAllColumns() {
      if (!isScrolling) return;

      const step = () => {
        if (!isScrolling) return;

        // Process all columns in the same frame to keep them synchronized
        columnContents.forEach((content, columnIndex) => {
          const column = columnElements[columnIndex];

          if (!content || !column) return;

          // Get current transform
          const transform = getComputedStyle(content).transform;
          let currentY = 0;

          if (transform !== 'none') {
            const matrix = transform.match(/matrix\(([^)]+)\)/);
            if (matrix) {
              const values = matrix[1].split(',');
              currentY = parseFloat(values[5]) || 0;
            }
          }

          const jitter = scrollDirection !== 'alternate' ? columnJitter[columnIndex] : 1;
          const scrollAmount = (scrollSpeed / 10) * jitter;
          const scrollUp = isScrollUp(columnIndex);

          if (scrollUp) {
            // Scrolling UP
            let newY = currentY - scrollAmount;
            content.style.transform = `translateY(${newY}px)`;

            const firstChild = content.firstElementChild;
            if (firstChild) {
              const itemRect = firstChild.getBoundingClientRect();
              const columnRect = column.getBoundingClientRect();

              if (itemRect.bottom < columnRect.top - 100) {
                const itemHeight = firstChild.offsetHeight + 10;
                const removedVideo = firstChild.querySelector('video');
                releaseItem(firstChild);
                content.removeChild(firstChild);

                // If the removed item had the unmuted video, pick a new one
                if (removedVideo && removedVideo === unmutedVideo) {
                  unmutedVideo = null;
                  if (!isMuted) unmuteRandomVideo();
                }

                // When an item is removed from the top, the whole content block shifts up.
                // We need to adjust the transform downward by the same amount to compensate.
                newY += itemHeight;
                content.style.transform = `translateY(${newY}px)`;

                addNewItemToColumn(columnIndex, false); // Add to bottom
              }
            }
          } else {
            // Scrolling DOWN
            let newY = currentY + scrollAmount;
            content.style.transform = `translateY(${newY}px)`;

            const lastChild = content.lastElementChild;
            if (lastChild) {
              const itemRect = lastChild.getBoundingClientRect();
              const columnRect = column.getBoundingClientRect();

              if (itemRect.top > columnRect.bottom + 100) {
                const removedVideo = lastChild.querySelector('video');
                releaseItem(lastChild);
                content.removeChild(lastChild);

                // If the removed item had the unmuted video, pick a new one
                if (removedVideo && removedVideo === unmutedVideo) {
                  unmutedVideo = null;
                  if (!isMuted) unmuteRandomVideo();
                }

                addNewItemToColumn(columnIndex, true); // Add to top
              }
            }
          }

          // Ensure we always have enough items in the column
          if (content.children.length < 5 && !columnLoading[columnIndex]) {
            addNewItemToColumn(columnIndex, !scrollUp);
          }
        });

        // Continue the animation
        animationFrameId = requestAnimationFrame(step);
      };

      step();
    }

    // Handle filter changes
    [filterGif, filterWebm, filterMp4, filterImages].forEach(filter => {
      filter.addEventListener('click', () => {
        filter.classList.toggle('active');
        updateFileCount();
        resetGrid();
      });
    });

    // Handle keyboard controls
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault(); // Prevent page scroll
        if (isScrolling) {
          stopScrolling();
          pauseButton.innerHTML = '<img src="play.png" alt="Play">';
        } else {
          startScrolling();
          pauseButton.innerHTML = '<img src="pause.png" alt="Pause">';
        }
      }
    });

    // Manual scroll via mouse wheel when paused
    document.addEventListener('wheel', (e) => {
      if (isScrolling) return;
      e.preventDefault();
      const delta = e.deltaY;
      columnContents.forEach((content) => {
        const transform = getComputedStyle(content).transform;
        let currentY = 0;
        if (transform !== 'none') {
          const matrix = transform.match(/matrix\(([^)]+)\)/);
          if (matrix) currentY = parseFloat(matrix[1].split(',')[5]) || 0;
        }
        content.style.transform = `translateY(${currentY - delta}px)`;
      });
    }, { passive: false });

    // Handle visibility change to pause/resume scrolling
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopScrolling();
      } else {
        startScrolling();
      }
    });

    // Handle controls visibility
    const controlsTrigger = document.getElementById('controls-trigger');
    const exitTrigger = document.getElementById('exit-trigger');
    const controls = document.getElementById('controls');

    controlsTrigger.addEventListener('mouseenter', () => {
      controls.classList.add('show');
      controlsTrigger.classList.add('hide');
      exitTrigger.classList.add('hide');
    });

    let bufferTracker = null;

    function stopBufferTracking() {
      if (bufferTracker) {
        document.removeEventListener('mousemove', bufferTracker);
        bufferTracker = null;
      }
    }

    controls.addEventListener('mouseleave', () => {
      if (bufferTracker) return;
      bufferTracker = (e) => {
        const rect = controls.getBoundingClientRect();
        const inBuffer =
          e.clientY > rect.bottom &&
          e.clientY <= rect.bottom + 150 &&
          e.clientX >= rect.left &&
          e.clientX <= rect.right;
        if (!controls.matches(':hover') && !inBuffer) {
          controls.classList.remove('show');
          controlsTrigger.classList.remove('hide');
          exitTrigger.classList.remove('hide');
          stopBufferTracking();
        }
      };
      document.addEventListener('mousemove', bufferTracker);
    });

    controlsTrigger.addEventListener('mouseleave', () => {
      // Add a small delay to prevent flickering when moving to controls
      setTimeout(() => {
        if (!controls.matches(':hover')) {
          controls.classList.remove('show');
          controlsTrigger.classList.remove('hide');
          exitTrigger.classList.remove('hide');
        }
      }, 100);
    });

    // Delete functionality
    let itemToDelete = null;

    container.addEventListener('click', (event) => {
      if (event.target.classList.contains('delete-overlay')) {
        // Delete button clicked - pause scrolling
        if (isScrolling) {
          stopScrolling();
          pauseButton.innerHTML = '<img src="play.png" alt="Play">';
        }

        itemToDelete = event.target.closest('.grid-item');
        deleteModal.classList.add('show');
      } else if (event.target.tagName === 'IMG' || event.target.tagName === 'VIDEO') {
        // Image or video clicked - toggle pause/play
        event.preventDefault();
        if (isScrolling) {
          stopScrolling();
          pauseButton.innerHTML = '<img src="play.png" alt="Play">';
        } else {
          startScrolling();
          pauseButton.innerHTML = '<img src="pause.png" alt="Pause">';
        }
      }
    });

    cancelDeleteButton.addEventListener('click', () => {
      deleteModal.classList.remove('show');
      itemToDelete = null;

      // Auto-resume scrolling after canceling
      startScrolling();
      pauseButton.innerHTML = '<img src="pause.png" alt="Pause">';
    });

    confirmDeleteButton.addEventListener('click', async () => {
      if (itemToDelete) {
        const url = itemToDelete.dataset.url;

        try {
          // Call the backend DELETE endpoint
          const response = await fetch(`/api/delete?path=${encodeURIComponent(url)}`, {
            method: 'DELETE'
          });

          if (response.ok) {
            adjustStats(url, -1);
            // File successfully deleted from server
            let columnIndex;
            if (pinnedItems.has(itemToDelete)) {
              const pinData = pinnedItems.get(itemToDelete);
              columnIndex = pinData.columnIndex;
              if (pinData.spacer.parentNode) pinData.spacer.parentNode.removeChild(pinData.spacer);
              pinnedItems.delete(itemToDelete);
            } else {
              const content = itemToDelete.parentNode;
              columnIndex = Array.from(container.children).indexOf(content.parentNode);
            }

            // Check if deleted item had the unmuted video
            const deletedVideo = itemToDelete.querySelector('video');
            if (deletedVideo && deletedVideo === unmutedVideo) {
              unmutedVideo = null;
              if (!isMuted) unmuteRandomVideo();
            }

            // Remove the item from the DOM (works whether pinned or not)
            releaseItem(itemToDelete);
            itemToDelete.parentNode.removeChild(itemToDelete);

            // Add a new item to replace the deleted one
            addNewItemToColumn(columnIndex, false);

            console.log('File deleted successfully:', url);
          } else {
            console.error('Failed to delete file:', response.statusText);
            alert('Failed to delete the file. Please try again.');
          }
        } catch (error) {
          console.error('Error deleting file:', error);
          alert('An error occurred while deleting the file. Please try again.');
        }

        // Close the delete modal
        deleteModal.classList.remove('show');
        itemToDelete = null;

        // Auto-resume scrolling after deletion
        startScrolling();
        pauseButton.innerHTML = '<img src="pause.png" alt="Pause">';
      }
    });

    // Click outside modal to cancel
    deleteModal.addEventListener('click', (event) => {
      if (event.target === deleteModal) {
        // Clicked on the backdrop (outside the modal content)
        deleteModal.classList.remove('show');
        itemToDelete = null;

        // Auto-resume scrolling after canceling
        startScrolling();
        pauseButton.innerHTML = '<img src="pause.png" alt="Pause">';
      }
    });

    // Focus / lightbox mode
    const focusModal = document.getElementById('focusModal');
    const focusContent = document.getElementById('focusContent');

    function openFocus(url) {
      focusContent.innerHTML = '';
      let media;
      if (url.endsWith('.webm') || url.endsWith('.mp4')) {
        media = document.createElement('video');
        media.src = url;
        media.autoplay = true;
        media.loop = true;
        media.muted = isMuted;
        media.controls = true;
      } else {
        media = document.createElement('img');
        media.src = url;
      }
      focusContent.appendChild(media);
      focusModal.classList.add('show');
      stopScrolling();
      pauseButton.innerHTML = '<img src="play.png" alt="Play">';
    }

    function closeFocus() {
      focusModal.classList.remove('show');
      const focusVideo = focusContent.querySelector('video');
      if (focusVideo) {
        focusVideo.pause();
        focusVideo.src = '';
        focusVideo.load();
      }
      focusContent.innerHTML = '';
      startScrolling();
      pauseButton.innerHTML = '<img src="pause.png" alt="Pause">';
    }

    focusModal.addEventListener('click', (e) => {
      if (e.target === focusModal) closeFocus();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && focusModal.classList.contains('show')) closeFocus();
    });

    container.addEventListener('dblclick', (e) => {
      const item = e.target.closest('.grid-item');
      if (item) openFocus(item.dataset.url);
    });

    async function exitApp() {
      try {
        await fetch('/api/exit', { method: 'POST' });
      } catch (e) {
        // Expected - server shuts down so the request may fail
      }
      // Try to close the tab (works if the page was opened by window.open / script)
      window.close();
    }

    // Exit button in controls panel
    document.getElementById('exitButton').addEventListener('click', exitApp);

    // Persistent exit trigger (top right)
    document.getElementById('exit-trigger').addEventListener('click', exitApp);

    // Initialize
    fetchStats();
    resetGrid();
  </script>
</body>
</html>
